name: Feature request
description: Something the platform should do and does not
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check `docs/DESIGN.md` first — a fair number of absences here
        are deliberate, and the reasoning is written down. Arguing with a
        documented decision is welcome; it just starts from a different place
        than asking for something nobody has considered.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The task, not the feature. "I need to know which of my sources have
        gone quiet" tells the maintainer more than "add a last-contact
        column", and may have a better answer than the one you had in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today
      description: Including "I don't" — that is useful to know.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you think should happen
    validations:
      required: false
